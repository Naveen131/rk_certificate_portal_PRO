<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login · NANI CALIBRATIONS CERTIFICATE PORTAL</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      height: 100vh;
      background: linear-gradient(135deg, #0f172a, #2563eb);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-wrapper {
      width: 100%;
      max-width: 380px;
      padding: 20px;
    }

    .login-card {
      background: white;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 25px 60px rgba(0,0,0,.25);
      animation: fadeIn 0.6s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .logo {
      text-align: center;
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 6px;
      color: #0f172a;
    }

    .subtitle {
      text-align: center;
      font-size: 14px;
      color: #6b7280;
      margin-bottom: 24px;
    }

    label {
      font-size: 14px;
      font-weight: 500;
      margin-top: 14px;
      display: block;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      border-radius: 10px;
      border: 1px solid #d1d5db;
      font-size: 14px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 2px rgba(37,99,235,.15);
    }

    button {
      margin-top: 22px;
      width: 100%;
      padding: 12px;
      background: #2563eb;
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s ease;
    }

    button:hover {
      background: #1d4ed8;
    }

    .error {
      margin-top: 14px;
      background: #fee2e2;
      color: #991b1b;
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      text-align: center;
    }

    .footer {
      margin-top: 16px;
      text-align: center;
      font-size: 12px;
      color: #9ca3af;
    }
  </style>
</head>

<body>

<div class="login-wrapper">
  <div class="login-card">

    <div class="logo">🎓 NANI CALIBRATIONS</div>
    <div class="subtitle">Login to download your certificates</div>

    <form method="post">
      {% csrf_token %}

      <label>Username</label>
      <input type="text" name="username" placeholder="Enter username" required>

      <label>Password</label>
      <input type="password" name="password" placeholder="Enter password" required>

      <button type="submit">Sign In</button>

      {% if form.errors %}
        <div class="error">
          Invalid username or password
        </div>
      {% endif %}
    </form>

    <div class="footer">
      © {{ now|date:"Y" }} NANI CALIBRATIONS CERTIFICATE PORTAL
    </div>

  </div>
</div>

</body>
</html>
