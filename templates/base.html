<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RK Certificate Portal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: #f4f6f8;
      color: #1f2937;
    }

    /* HEADER */
    header {
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: white;
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 20px rgba(0,0,0,.15);
    }

    header .logo {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: .5px;
    }

    header .user {
      font-size: 14px;
    }

    header a {
      color: #93c5fd;
      text-decoration: none;
      margin-left: 12px;
      font-weight: 500;
    }

    header a:hover {
      text-decoration: underline;
    }

    /* MAIN CONTAINER */
    .container {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 20px;
    }

    /* PAGE TITLE */
    .page-title {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 20px;
    }

    /* FOOTER */
    footer {
      margin-top: 60px;
      padding: 20px;
      text-align: center;
      font-size: 13px;
      color: #6b7280;
    }

    /* UTIL */
    .card {
      background: white;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,.06);
    }

    .btn {
      display: inline-block;
      background: #2563eb;
      color: white;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      transition: background .2s ease;
    }

    .btn:hover {
      background: #1d4ed8;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">🎓 RK Certificate Portal</div>

  {% if request.user.is_authenticated %}
    <div class="user">
      {{ request.user.username }}
      <a href="/dashboard/">Dashboard</a>
      <a href="/logout/">Logout</a>
    </div>
  {% endif %}
</header>

<div class="container">
  {% block content %}{% endblock %}
</div>

<footer>
  © {{ now|date:"Y" }} RK Certificate Portal · All rights reserved
</footer>

</body>
</html>
