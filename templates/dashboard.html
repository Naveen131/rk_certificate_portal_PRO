{% extends "base.html" %}
{% block content %}

<style>
  .dashboard-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
  }

  .dashboard-header h2 {
    margin: 0;
    font-size: 22px;
    font-weight: 600;
  }

  .count {
    background: #e0e7ff;
    color: #1e3a8a;
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 500;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
  }

  .cert-card {
    background: #ffffff;
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,.07);
    transition: transform .2s ease, box-shadow .2s ease;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .cert-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 16px 30px rgba(0,0,0,.1);
  }

  .cert-title {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 8px;
  }

  .cert-date {
    font-size: 13px;
    color: #6b7280;
    margin-bottom: 18px;
  }

  .download-btn {
    text-align: center;
    background: #2563eb;
    color: white;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 500;
    text-decoration: none;
    transition: background .2s ease;
  }

  .download-btn:hover {
    background: #1d4ed8;
  }

  .empty-state {
    background: #ffffff;
    border-radius: 16px;
    padding: 50px 30px;
    text-align: center;
    box-shadow: 0 10px 25px rgba(0,0,0,.06);
  }

  .empty-state h3 {
    margin-bottom: 8px;
    font-size: 18px;
  }

  .empty-state p {
    color: #6b7280;
    font-size: 14px;
  }
</style>

<div class="dashboard-header">
  <h2>My Certificates</h2>
  <div class="count">
    {{ certificates|length }} Certificates
  </div>
</div>

{% if certificates %}
  <div class="grid">
    {% for cert in certificates %}
      <div class="cert-card">
        <div>
          <div class="cert-title">{{ cert.title }}</div>
          <div class="cert-date">
            Uploaded on {{ cert.uploaded_at|date:"d M Y" }}
          </div>
        </div>
        <a href="{% url 'download_certificate' cert.id %}"
           class="download-btn">
          ⬇ Download Certificate
        </a>
      </div>
    {% endfor %}
    {% endif %}
  </div>

{% endblock %}
